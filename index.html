            darkMode: 'media',

                extend: {
                    colors: {
                        brand: {

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">

                    <i class="fa-solid fa-warehouse text-lg"></i>
                </div>
                <div>

                </div>
            </div>

            <div class="flex items-center space-x-3">

                    <span class="hidden sm:inline">Pedido</span>
                    <span id="cart-badge" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-6 h-6 rounded-full flex items-center justify-center font-bold shadow-md hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col">
        
        <!-- Controls & Filters -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6 space-y-4">
            <div class="flex flex-col md:flex-row gap-3 items-center justify-between">
                <!-- Search Box -->
                <div class="relative w-full md:w-96">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400"></i>
                    <input type="text" id="search-input" oninput="filterProducts()" placeholder="Buscar por código, producto, marca..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white text-sm transition">
                </div>

                <!-- Categories Filter Bar -->
                <div class="w-full md:w-auto overflow-x-auto pb-1 md:pb-0 flex items-center space-x-2 no-scrollbar" id="category-filters">
                    <button onclick="setCategory('TODOS')" class="category-btn active px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap bg-brand-600 text-white shadow-sm transition">Todos</button>
                    <button onclick="setCategory('ALIMENTOS')" class="category-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Alimentos</button>
                    <button onclick="setCategory('FIAMBRES')" class="category-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Fiambres y Quesos</button>
                    <button onclick="setCategory('ALMACEN')" class="category-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Art. de Almacén</button>
                    <button onclick="setCategory('LACTEOS')" class="category-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Lácteos y Yogures</button>
                    <button onclick="setCategory('LIMPIEZA')" class="category-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Limpieza</button>
                    <button onclick="setCategory('PERFUMERIA')" class="category-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Perfumería y Art.</button>
                </div>
            </div>
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pb-20">
            <!-- Dynamic Cards Rendered Here -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-center">
            <div class="bg-slate-100 text-slate-400 p-4 rounded-full text-3xl mb-3">
                <i class="fa-solid fa-box-open"></i>
            </div>

            <p class="text-slate-500 text-sm">Intente con otra búsqueda o categoría.</p>

    </main>

    <!-- Floating Cart Bar for Mobile -->
    <div id="floating-cart" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-4 shadow-lg sm:hidden flex items-center justify-between z-20 translate-y-full transition-transform duration-300">

            <p class="text-xs text-slate-500 font-medium">Total Estimado</p>
            <p id="mobile-total" class="text-lg font-bold text-slate-900">$0.00</p>
        </div>
        <button onclick="toggleCartModal(true)" class="bg-brand-600 text-white font-semibold px-6 py-2.5 rounded-xl shadow-md flex items-center space-x-2">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Ver Pedido</span>
        </button>
    </div>

    <!-- Cart Modal / Drawer -->
    <div id="cart-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex justify-end transition-opacity">
        <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl transform translate-x-full transition-transform duration-300" id="cart-drawer">
            <!-- Modal Header -->
            <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-file-invoice text-brand-600"></i>
                    <h2 class="font-bold text-slate-900 text-lg">Resumen del Pedido</h2>
                </div>
                <button onclick="toggleCartModal(false)" class="text-slate-400 hover:text-slate-600 p-2 rounded-lg">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Client Info Input -->
            <div class="p-4 border-b border-slate-100 bg-slate-50/50 space-y-3">
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Nombre del Cliente / Local</label>
                <input type="text" id="client-name" placeholder="Ej. Autoservicio Don Juan" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <!-- Cart Items List -->
            <div id="cart-items-container" class="flex-1 overflow-y-auto p-4 divide-y divide-slate-100">
                <!-- Cart items injected here -->
            </div>

            <!-- Cart Footer -->
            <div class="p-4 border-t border-slate-200 bg-slate-50 space-y-4">
                <div class="flex justify-between items-center">
                    <span class="text-slate-600 font-medium">Total General:</span>
                    <span id="cart-total" class="text-xl font-black text-slate-900">$0.00</span>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button onclick="clearCart()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 py-3 rounded-xl font-semibold text-sm transition">
                        Vaciar
                    </button>
                    <button onclick="shareWhatsApp()" class="bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-semibold text-sm transition flex items-center justify-center space-x-2 shadow-md shadow-emerald-600/20">
                        <i class="fa-brands fa-whatsapp text-lg"></i>
                        <span>Enviar WhatsApp</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

        let currentCategory = 'TODOS';

        document.addEventListener('DOMContentLoaded', () => {
            renderProducts(products);
        });

        function setCategory(category) {
            currentCategory = category;
            
            document.querySelectorAll('.category-btn').forEach(btn => {
                const btnText = btn.textContent.toLowerCase();
                let matches = false;
                if (category === 'TODOS' && btnText.includes('todos')) matches = true;
                if (category === 'ALIMENTOS' && btnText.includes('alimentos')) matches = true;
                if (category === 'FIAMBRES' && btnText.includes('fiambres')) matches = true;
                if (category === 'ALMACEN' && btnText.includes('almacén')) matches = true;
                if (category === 'LACTEOS' && btnText.includes('lácteos')) matches = true;
                if (category === 'LIMPIEZA' && btnText.includes('limpieza')) matches = true;
                if (category === 'PERFUMERIA' && btnText.includes('perfumería')) matches = true;

                if(matches) {
                    btn.className = "category-btn active px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap bg-brand-600 text-white shadow-sm transition";
                } else {
                    btn.className = "category-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200 transition";
                }
            });

            filterProducts();
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            
            const filtered = products.filter(p => {
                const matchesCategory = currentCategory === 'TODOS' || p.category === currentCategory;
                const matchesQuery = p.name.toLowerCase().includes(query) || p.code.toLowerCase().includes(query);
                return matchesCategory && matchesQuery;
            });

            renderProducts(filtered);
        }

        function renderProducts(items) {
            const grid = document.getElementById('product-grid');
            const emptyState = document.getElementById('empty-state');
            
            grid.innerHTML = '';
            
            if (items.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            } else {
                emptyState.classList.remove('flex');
                emptyState.classList.add('hidden');
            }

            items.forEach(product => {
                const qty = cart[product.code] || 0;
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between hover:border-brand-300 transition duration-200";
                
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold uppercase tracking-wider px-2 py-0.5 bg-slate-100 text-slate-600 rounded-md">${product.category}</span>
                            <span class="text-xs text-slate-400 font-mono">#${product.code}</span>
                        </div>
                        <h3 class="font-semibold text-slate-800 text-sm mb-2 line-clamp-2">${product.name}</h3>
                    </div>
                    <div>
                        <div class="text-lg font-black text-slate-900 mb-3">$${product.price.toLocaleString('es-AR', {minimumFractionDigits: 2})}</div>
                        
                        ${qty === 0 ? `
                            <button onclick="updateQuantity('${product.code}', 1)" class="w-full bg-slate-900 hover:bg-brand-600 text-white font-medium py-2 rounded-xl text-sm transition flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-plus text-xs"></i>
                                <span>Agregar</span>
                            </button>
                        ` : `
                            <div class="flex items-center justify-between bg-slate-100 rounded-xl p-1">
                                <button onclick="updateQuantity('${product.code}', -1)" class="w-8 h-8 bg-white hover:bg-red-50 hover:text-red-600 rounded-lg shadow-sm font-bold flex items-center justify-center transition">
                                    <i class="fa-solid fa-minus text-xs"></i>
                                </button>
                                <span class="font-bold text-slate-800 text-sm px-3">${qty}</span>
                                <button onclick="updateQuantity('${product.code}', 1)" class="w-8 h-8 bg-white hover:bg-brand-50 hover:text-brand-600 rounded-lg shadow-sm font-bold flex items-center justify-center transition">
                                    <i class="fa-solid fa-plus text-xs"></i>
                                </button>
                            </div>
                        `}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateQuantity(code, delta) {
            const current = cart[code] || 0;
            const updated = current + delta;
            
            if (updated <= 0) {
                delete cart[code];
            } else {
                cart[code] = updated;
            }

            filterProducts();
            updateCartUI();

            if (delta > 0 && current === 0) {
                showToast("Producto agregado al pedido");
            }
        }

        function updateCartUI() {
            const codes = Object.keys(cart);
            const totalCount = codes.reduce((acc, code) => acc + cart[code], 0);
            
            const badge = document.getElementById('cart-badge');
            if (totalCount > 0) {
                badge.textContent = totalCount;
                badge.classList.remove('hidden');
                document.getElementById('floating-cart').classList.remove('translate-y-full');
            } else {
                badge.classList.add('hidden');
                document.getElementById('floating-cart').classList.add('translate-y-full');
            }

            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';

            let grandTotal = 0;

            if (codes.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-slate-400 py-12">
                        <i class="fa-solid fa-cart-arrow-down text-3xl mb-2"></i>
                        <p class="text-sm">El pedido está vacío</p>
                    </div>
                `;
            } else {
                codes.forEach(code => {
                    const product = products.find(p => p.code === code);
                    const qty = cart[code];
                    const subtotal = product.price * qty;
                    grandTotal += subtotal;

                    const itemEl = document.createElement('div');
                    itemEl.className = "py-3 flex items-center justify-between";
                    itemEl.innerHTML = `
                        <div class="flex-1 pr-2">
                            <h4 class="text-xs font-semibold text-slate-800 line-clamp-1">${product.name}</h4>
                            <p class="text-xs text-slate-500 font-mono">$${product.price.toLocaleString('es-AR')} x ${qty}</p>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="font-bold text-sm text-slate-900">$${subtotal.toLocaleString('es-AR', {minimumFractionDigits: 2})}</span>
                            <button onclick="removeFromCart('${code}')" class="text-slate-400 hover:text-red-500 transition p-1">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    `;
                    container.appendChild(itemEl);
                });
            }

            document.getElementById('cart-total').textContent = `$${grandTotal.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;
            document.getElementById('mobile-total').textContent = `$${grandTotal.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;
        }

        function removeFromCart(code) {
            delete cart[code];
            filterProducts();
            updateCartUI();
        }

        function clearCart() {
            cart = {};
            filterProducts();
            updateCartUI();
            showToast("Pedido vaciado");
        }

        function toggleCartModal(open) {
            const modal = document.getElementById('cart-modal');
            const drawer = document.getElementById('cart-drawer');
            
            if (open) {
                modal.classList.remove('hidden');
                setTimeout(() => drawer.classList.remove('translate-x-full'), 10);
            } else {
                drawer.classList.add('translate-x-full');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        }

        function shareWhatsApp() {
            const clientName = document.getElementById('client-name').value.trim() || "Cliente del Depósito";
            const codes = Object.keys(cart);
            
            if (codes.length === 0) {
                showToast("El pedido está vacío");
                return;
            }

            let message = `🛒 *NUEVO PEDIDO - DEPÓSITO*\n`;
            message += `👤 *Cliente:* ${clientName}\n`;
            message += `📅 *Fecha:* 15/08/2026\n`;
            message += `-----------------------------------\n\n`;

            let grandTotal = 0;
            codes.forEach((code, index) => {
                const product = products.find(p => p.code === code);
                const qty = cart[code];
                const subtotal = product.price * qty;
                grandTotal += subtotal;
                message += `${index + 1}. *${product.name}*\n`;
                message += `   Código: ${code} | Cant: *${qty}* | Sub: $${subtotal.toLocaleString('es-AR', {minimumFractionDigits: 2})}\n\n`;
            });

            message += `-----------------------------------\n`;
            message += `💰 *TOTAL GENERAL: $${grandTotal.toLocaleString('es-AR', {minimumFractionDigits: 2})}*\n`;

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/?text=${encodedMessage}`, '_blank');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
